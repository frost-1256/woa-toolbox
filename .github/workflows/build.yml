name: build

on:
  push:
  pull_request:

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Core - pub get / analyze / test
        working-directory: packages/woa_toolbox_core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: MCP - pub get / analyze / test
        working-directory: packages/woa_toolbox_mcp
        run: |
          dart pub get
          dart analyze
          dart test

  app-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: App - pub get / analyze / test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Build Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: woa-toolbox-windows
          path: app/build/windows/x64/runner/Release

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Build Linux
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: woa-toolbox-linux
          path: app/build/linux/x64/release/bundle
